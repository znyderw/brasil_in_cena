<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesse o Brasil in Cena — QR Code</title>
    <meta name="description"
        content="Escaneie o QR Code para acessar o Brasil in Cena — Revista Cultural Digital sobre as cinco regiões brasileiras.">

    <!-- Google Fonts: Newsreader + Space Grotesk + Space Mono + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500;1,6..72,600&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/main.css?v=16.0">

    <style>
        .qr-poster-body {
            height: 100vh;
            min-height: 100vh;
            background-color: var(--color-darkgreen, #06352F);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(224, 109, 32, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(200, 135, 42, 0.14) 0%, transparent 48%),
                linear-gradient(to right, rgba(247, 244, 239, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(247, 244, 239, 0.035) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
            color: var(--color-offwhite, #F7F4EF);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(0.85rem, 2vh, 1.5rem) clamp(1.25rem, 3vw, 2.5rem);
            overflow: hidden;
        }

        /* Barra Superior Discreta */
        .qr-topbar {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .qr-brand {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            text-decoration: none;
            color: var(--color-offwhite, #F7F4EF);
        }

        .qr-brand-emblem {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid var(--color-accent, #E06D20);
            flex-shrink: 0;
        }

        .qr-brand-emblem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .qr-brand-name {
            font-family: var(--font-heading, 'Space Grotesk', sans-serif);
            font-size: 1rem;
            font-weight: 700;
            display: block;
            line-height: 1.1;
        }

        .qr-brand-sub {
            font-family: var(--font-mono, 'Space Mono', monospace);
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--color-accent, #E06D20);
            display: block;
        }

        .qr-topbar-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .qr-action-pill {
            font-family: var(--font-mono, 'Space Mono', monospace);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--color-offwhite, #F7F4EF);
            background: rgba(247, 244, 239, 0.08);
            border: 1px solid rgba(247, 244, 239, 0.22);
            border-radius: 999px;
            padding: 0.4rem 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .qr-action-pill:hover {
            background: var(--color-accent, #E06D20);
            border-color: var(--color-accent, #E06D20);
            color: #FFFFFF;
        }

        /* Palco Central Focado no Projetor */
        .qr-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: clamp(1rem, 2.2vh, 1.65rem);
            min-height: 0;
        }

        .qr-header-minimal {
            max-width: 780px;
        }

        .qr-main-title {
            font-family: var(--font-serif, 'Newsreader', serif);
            font-size: clamp(1.85rem, 3.4vw, 2.75rem);
            font-weight: 500;
            line-height: 1.12;
            letter-spacing: -0.02em;
            color: var(--color-offwhite, #F7F4EF);
            margin: 0 0 0.4rem;
        }

        .qr-main-title em {
            font-style: italic;
            font-weight: 600;
            color: var(--color-accent, #E06D20);
        }

        .qr-phrase {
            font-family: var(--font-body, 'Inter', sans-serif);
            font-size: clamp(0.95rem, 1.35vw, 1.15rem);
            color: rgba(247, 244, 239, 0.82);
            margin: 0;
        }

        /* Moldura Gigante do QR Code para Projetor */
        .qr-projector-card {
            position: relative;
            background-color: var(--color-offwhite, #F7F4EF);
            border: 3px solid var(--color-darkgreen, #06352F);
            border-radius: 12px;
            padding: clamp(1.1rem, 2.2vh, 1.75rem) clamp(1.4rem, 2.6vw, 2.2rem);
            box-shadow:
                14px 14px 0 rgba(0, 0, 0, 0.38),
                0 0 0 2px rgba(224, 109, 32, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Marcas gráficas nos cantos */
        .qr-mark {
            position: absolute;
            font-family: var(--font-mono, 'Space Mono', monospace);
            font-size: 0.85rem;
            color: rgba(6, 53, 47, 0.42);
            line-height: 1;
            user-select: none;
            pointer-events: none;
        }
        .qr-mark-tl { top: 8px; left: 10px; }
        .qr-mark-tr { top: 8px; right: 10px; }
        .qr-mark-bl { bottom: 8px; left: 10px; }
        .qr-mark-br { bottom: 8px; right: 10px; }

        .qr-svg-wrap {
            width: clamp(280px, 54vh, 480px);
            height: clamp(280px, 54vh, 480px);
            background: #FFFFFF;
            border: 2px solid var(--color-darkgreen, #06352F);
            border-radius: 8px;
            padding: clamp(0.5rem, 1.2vh, 0.9rem);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-svg-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            shape-rendering: crispEdges;
        }

        .qr-url-bar {
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .qr-url-link {
            font-family: var(--font-mono, 'Space Mono', monospace);
            font-size: clamp(0.82rem, 1.2vw, 1rem);
            font-weight: 700;
            color: var(--color-darkgreen, #06352F);
            text-decoration: none;
            letter-spacing: 0.02em;
        }

        .qr-url-link:hover {
            color: var(--color-accent, #E06D20);
        }

        /* Rodapé Discreto */
        .qr-footer {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            font-family: var(--font-mono, 'Space Mono', monospace);
            font-size: 0.7rem;
            color: rgba(247, 244, 239, 0.6);
        }

        .qr-color-bars {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .qr-color-swatch {
            width: 13px;
            height: 13px;
            border-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        @media (max-width: 640px) {
            .qr-poster-body {
                height: auto;
                overflow-y: auto;
            }
            .qr-svg-wrap {
                width: min(78vw, 340px);
                height: min(78vw, 340px);
            }
        }
    </style>
</head>
