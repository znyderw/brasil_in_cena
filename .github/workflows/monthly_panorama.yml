name: Atualização Mensal do Panorama Cultural

on:
  schedule:
    # Executa no dia 1º de cada mês à meia-noite (UTC)
    - cron: '0 0 1 * *'
  workflow_dispatch: # Permite execução manual pelo GitHub UI

jobs:
  update-panorama:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Executar Script de Coleta
        run: python scripts/sync_noticias.py

      - name: Commit e Push das Atualizações
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/noticias.json
          git diff-index --quiet HEAD || git commit -m "Auto-update Panorama Cultural (data/noticias.json)"
          git push
